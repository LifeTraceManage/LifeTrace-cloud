name: lifetrace-prod

x-cloud-env: &cloud-env
  LIFETRACE_ENV: "development"
  DEV_AUTH_ENABLED: "false"
  DATABASE_URL: "postgres://lifetrace:${POSTGRES_PASSWORD}@postgres:5432/lifetrace"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lifetrace
    volumes:
      - lifetrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrace -d lifetrace"]
      interval: 5s
      timeout: 3s
      retries: 20

  lifetrace-cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/lifetracemanage/lifetrace-cloud:main}
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *cloud-env
      LIFETRACE_BIND_ADDRESS: "0.0.0.0:8787"
      MIGRATION_ON_STARTUP: "true"
      PHOTO_STAGING_DIR: "/data/photo-staging"
      PUBLIC_WEB_BASE_URL: "${PUBLIC_WEB_BASE_URL:-http://8.148.75.45}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://8.148.75.45}"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_NAME: "lifetrace_session"
    volumes:
      - lifetrace_photo_staging:/data/photo-staging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  mail-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/lifetracemanage/lifetrace-cloud:main}
    entrypoint: ["/app/mail_worker"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *cloud-env
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      lifetrace-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  execution-worker:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/lifetracemanage/lifetrace-cloud:main}
    entrypoint: ["/app/execution_worker"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      <<: *cloud-env
      MIGRATION_ON_STARTUP: "false"
    depends_on:
      lifetrace-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: ${LIFETRACE_WEB_IMAGE:-ghcr.io/lifetracemanage/lifetrace-web:main}
    restart: unless-stopped
    ports:
      - "80:80"
      - "8869:8869"
    depends_on:
      lifetrace-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  lifetrace_pgdata:
  lifetrace_photo_staging:
