name: lifetrace

services:
  cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-ghcr.io/lifetracemanage/lifetrace-cloud:main}
    restart: unless-stopped
    env_file: .env.production
    environment:
      LIFETRACE_ENV: "selfhosted"
      DEV_AUTH_ENABLED: "false"
      LIFETRACE_BIND_ADDRESS: "0.0.0.0:8787"
      BEECOUNT_BIND_ADDRESS: "0.0.0.0:8869"
      LIFETRACE_DATABASE_PATH: "/data/lifetrace.db"
      PHOTO_STAGING_DIR: "/data/photo-staging"
      PUBLIC_WEB_BASE_URL: "${PUBLIC_WEB_BASE_URL:-http://127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://127.0.0.1}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-lifetrace_session}"
    ports:
      - "8869:8869"
    expose:
      - "8787"
    volumes:
      - lifetrace_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    image: ${LIFETRACE_WEB_IMAGE:-ghcr.io/lifetracemanage/lifetrace-web-app:main}
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s

volumes:
  lifetrace_data:
