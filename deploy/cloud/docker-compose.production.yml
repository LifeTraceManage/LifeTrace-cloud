name: lifetrace

services:
  cloud:
    image: ${LIFETRACE_CLOUD_IMAGE:-lifetrace-cloud:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      LIFETRACE_ENV: "selfhosted"
      DEV_AUTH_ENABLED: "false"
      LIFETRACE_BIND_ADDRESS: "0.0.0.0:8787"
      BEECOUNT_BIND_ADDRESS: "0.0.0.0:8869"
      LIFETRACE_DATABASE_PATH: "/data/lifetrace.db"
      PHOTO_STAGING_DIR: "/data/photo-staging"
      PUBLIC_WEB_BASE_URL: "${PUBLIC_WEB_BASE_URL:?set PUBLIC_WEB_BASE_URL in .env.production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env.production}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-lifetrace_session}"
    ports:
      - "8869:8869"
    expose:
      - "8787"
    volumes:
      - lifetrace_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    image: ${LIFETRACE_WEB_IMAGE:-lifetrace-web-app:local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      cloud:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s

  caddy:
    image: ${LIFETRACE_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      LIFETRACE_DOMAIN: "${LIFETRACE_DOMAIN:?set LIFETRACE_DOMAIN in .env.production}"
      LIFETRACE_PUBLIC_IP: "${LIFETRACE_PUBLIC_IP:?set LIFETRACE_PUBLIC_IP in .env.production}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  lifetrace_data:
  caddy_data:
  caddy_config:
