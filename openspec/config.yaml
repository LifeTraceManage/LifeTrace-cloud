schema: spec-driven
context: |
  LifeTrace Cloud is the independent Rust/Axum/PostgreSQL backend for the LifeTrace product family.
  It owns authenticated Sync v1 persistence plus shared cloud capabilities such as files, privacy,
  BeeCount compatibility, mail and supporting workers. PostgreSQL is the production persistence
  path; the in-memory sync repository is test/protocol-harness infrastructure only.
rules:
  specs:
    - Use MUST/SHALL requirements with Given/When/Then scenarios.
  tasks:
    - Mark tasks complete only after cargo tests pass.
