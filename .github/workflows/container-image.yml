name: LifeTrace Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lifetrace-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  cloud-image:
    name: Cloud image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/lifetracemanage/lifetrace-cloud
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifetrace-cloud-image
          cache-to: type=gha,mode=max,scope=lifetrace-cloud-image
          provenance: false

      - name: Publish image summary
        run: |
          {
            echo "### LifeTrace Cloud image"
            echo
            echo "- Image: ghcr.io/lifetracemanage/lifetrace-cloud:main"
            echo "- SHA tag: ghcr.io/lifetracemanage/lifetrace-cloud:sha-${GITHUB_SHA::7}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web-image:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/lifetracemanage/lifetrace-web-app
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifetrace-web-image
          cache-to: type=gha,mode=max,scope=lifetrace-web-image
          provenance: false

      - name: Publish image summary
        run: |
          {
            echo "### LifeTrace Web image"
            echo
            echo "- Image: ghcr.io/lifetracemanage/lifetrace-web-app:main"
            echo "- SHA tag: ghcr.io/lifetracemanage/lifetrace-web-app:sha-${GITHUB_SHA::7}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
