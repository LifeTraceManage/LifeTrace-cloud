name: Agent lockfile bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feat/agent-runtime-rig]
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-runtime-rig
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Resolve dependency lockfile
        run: cargo check --tests
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: resolve agent runtime dependencies"
          git pull --rebase origin feat/agent-runtime-rig
          git push
