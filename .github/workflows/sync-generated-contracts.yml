name: Sync Generated Contracts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: cargo run --manifest-path tools/contract-exporter/Cargo.toml
      - name: Commit regenerated contracts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/
          git commit -m "chore: regenerate contracts from cloud source"
          git push
