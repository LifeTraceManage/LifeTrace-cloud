name: Cloud CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TEST_DATABASE_PATH: /tmp/lifetrace-ci.db
      AUTH_PASSWORD_PEPPER: cloud-ci-password-pepper
      AUTH_TOKEN_HASH_PEPPER: cloud-ci-token-pepper
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Typecheck Web
        working-directory: apps/web
        run: npm run typecheck

      - name: Test Web
        working-directory: apps/web
        run: npm test

      - name: Build Web
        working-directory: apps/web
        run: npm run build

      - name: Verify Web dist
        run: test -s apps/web/dist/index.html

      - name: Validate OpenSpec repository
        run: npx --yes @fission-ai/openspec@1.13.0 validate --all --strict --no-interactive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2


      - name: Apply rustfmt
        run: cargo fmt

      - name: Commit rustfmt changes on this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- '*.rs')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '**/*.rs'
            git commit -m "style: apply rustfmt"
            git fetch origin "${{ github.head_ref }}"
            git rebase "origin/${{ github.head_ref }}"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - run: cargo fmt --check
      - run: cargo test --locked -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - run: cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml

      - name: Regenerate contracts
        run: cargo run --manifest-path tools/contract-exporter/Cargo.toml

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: contracts/
          if-no-files-found: error

      - name: Commit generated contracts on this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- contracts/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/
            git commit -m "contracts: regenerate generated artifacts"
            git fetch origin "${{ github.head_ref }}"
            git rebase "origin/${{ github.head_ref }}"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Require committed generated contracts
        run: |
          git diff --exit-code -- contracts/
          test -z "$(git ls-files --others --exclude-standard contracts/)"
