name: LifeTrace CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifetrace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Verify dist
        run: test -s apps/web/dist/index.html

  cloud:
    name: Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TEST_DATABASE_PATH: /tmp/lifetrace-ci.db
      AUTH_PASSWORD_PEPPER: cloud-ci-password-pepper
      AUTH_TOKEN_HASH_PEPPER: cloud-ci-token-pepper
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenSpec repository
        run: npx --yes @fission-ai/openspec@1.13.0 validate --all --strict --no-interactive

      - name: Validate deployment shell scripts
        run: |
          bash -n deploy/cloud/install.sh
          bash -n deploy/cloud/deploy-production.sh
          bash -n deploy/cloud/verify-production.sh

      - name: Validate production Compose
        run: |
          cp deploy/cloud/.env.production.example deploy/cloud/.env.production
          docker compose --env-file deploy/cloud/.env.production \
            -f deploy/cloud/docker-compose.production.yml config --quiet
          rm -f deploy/cloud/.env.production

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2



      - run: cargo fmt --check
      - run: cargo test --locked -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/lifetrace-contracts/Cargo.toml
      - run: cargo test --manifest-path crates/lifetrace-sync-client/Cargo.toml

      - name: Regenerate contracts
        run: cargo run --manifest-path tools/contract-exporter/Cargo.toml

      - name: Require committed generated contracts
        run: |
          git diff --exit-code -- contracts/
          test -z "$(git ls-files --others --exclude-standard contracts/)"
